# Monitoring Configuration
# Thresholds and settings for data drift and model performance monitoring

# Data drift detection settings
data_drift:
  # Population Stability Index (PSI) thresholds
  psi:
    warning_threshold: 0.1    # PSI > 0.1 indicates slight drift
    critical_threshold: 0.25  # PSI > 0.25 indicates significant drift

  # Kolmogorov-Smirnov statistic thresholds
  ks_statistic:
    warning_threshold: 0.1
    critical_threshold: 0.2

  # Jensen-Shannon divergence thresholds
  js_divergence:
    warning_threshold: 0.1
    critical_threshold: 0.2

  # Features to monitor (null means all features)
  monitored_features: null

  # Reference dataset settings
  reference_data:
    use_training_data: true
    sample_size: 10000

  # Production data window
  production_window:
    days: 7
    min_samples: 100

# Model performance monitoring
performance:
  # AUC thresholds
  auc:
    warning_threshold: 0.72   # Warn if AUC drops below 0.72
    critical_threshold: 0.68  # Critical if AUC drops below 0.68
    baseline: 0.75            # Expected baseline AUC

  # Log loss thresholds
  log_loss:
    warning_threshold: 0.5
    critical_threshold: 0.6

  # Brier score thresholds
  brier_score:
    warning_threshold: 0.22
    critical_threshold: 0.25

  # KS statistic thresholds
  ks_statistic:
    warning_threshold: 0.30
    critical_threshold: 0.25

  # Calibration error thresholds
  calibration_error:
    warning_threshold: 0.05
    critical_threshold: 0.10

# Risk band monitoring
risk_band_monitoring:
  # Expected default rates by risk band with tolerance
  expected_rates:
    low_risk:
      expected: 0.02
      tolerance: 0.02  # Warn if actual differs by more than 2%
    medium_risk:
      expected: 0.08
      tolerance: 0.04
    high_risk:
      expected: 0.25
      tolerance: 0.10

  # Approval rate monitoring
  approval_rate:
    expected: 0.60
    warning_deviation: 0.10

# Alerting configuration
alerting:
  # Enable/disable alerts
  enabled: true

  # Alert channels (placeholder for future implementation)
  channels:
    - type: "file"
      path: "logs/alerts.log"
    # - type: "email"
    #   recipients: ["risk-team@company.com"]
    # - type: "slack"
    #   webhook: "${SLACK_WEBHOOK_URL}"

  # Alert throttling
  throttle_minutes: 60

# Retraining triggers
retraining:
  # Automatic retraining flag
  auto_retrain: false

  # Conditions that trigger retraining
  triggers:
    - metric: "psi"
      threshold: 0.25
      window_days: 7
    - metric: "auc"
      threshold: 0.68
      comparison: "less_than"
    - metric: "default_rate_deviation"
      threshold: 0.10

  # Flag file to indicate retraining needed
  trigger_file: "data/processed/retrain_trigger.flag"

  # Require human approval before promoting new model
  require_human_approval: true

# Reporting
reporting:
  # Report generation frequency
  drift_report_frequency: "daily"
  performance_report_frequency: "weekly"

  # Report formats
  formats: ["html", "json"]

  # Retention period for reports (days)
  retention_days: 90

# Delayed label handling
delayed_labels:
  # Expected delay in receiving default labels (days)
  expected_delay_days: 30

  # Window for joining predictions with outcomes
  outcome_window_days: 90
